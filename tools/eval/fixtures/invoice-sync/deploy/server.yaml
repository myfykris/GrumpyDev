apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-sync-server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: invoice-sync-server }
  template:
    metadata:
      labels: { app: invoice-sync-server }
    spec:
      containers:
        - name: server
          image: registry.internal/invoice-sync:1.4.2
          env:
            - { name: TZ, value: "UTC" }
