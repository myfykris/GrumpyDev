apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-sync-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: invoice-sync-worker }
  template:
    metadata:
      labels: { app: invoice-sync-worker }
    spec:
      containers:
        - name: worker
          image: registry.internal/invoice-sync:1.4.2
          command: ["node", "dist/worker.js"]
          env:
            - { name: TZ, value: "UTC" }
