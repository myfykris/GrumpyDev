  <rect x="65" y="65" width="1070" height="500" rx="28" fill="#202931" stroke="#c6d3da" stroke-opacity="0.13"/>
  <text x="105" y="137" fill="#a8e66b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">GRUMPYDEV.AI</text>
  <text x="101" y="257" fill="#cbd7dd" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="-3">Your plan has</text>
  <text x="101" y="343" fill="#a8e66b" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="-4">problems.</text>
  <text x="105" y="422" fill="#aebdc5" font-family="Arial, Helvetica, sans-serif" font-size="26">Adversarial engineering review for plans that</text>
  <text x="105" y="458" fill="#aebdc5" font-family="Arial, Helvetica, sans-serif" font-size="26">deserve better than a polite nod.</text>
  <text x="105" y="521" fill="#73838c" font-family="Courier New, monospace" font-size="18">FIND THE FAILURE BEFORE IMPLEMENTATION.</text>
