      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#c6d3da" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="40%" r="58%">
      <stop offset="0" stop-color="#a8e66b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a8e66b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#1c242b"/>
